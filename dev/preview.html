<!DOCTYPE html>
<html dark>
<head>
<meta charset="utf-8">
<title>Panel dev preview</title>
<!--
  Dev harness for the in-page panel: stubs the chrome.* APIs and loads the real
  ui-builder.js + both skins' CSS, so panel design work can be previewed and
  interacted with in a plain browser tab (no extension reload loop).
  Serve the repo root (e.g. the "options-page" launch config) and open
  /dev/preview.html. Not shipped: dev/ is not referenced by the manifest.
-->
<style>
  body { margin: 0; padding: 24px; background: #0f0f0f; font-family: Roboto, Arial, sans-serif; transition: background 0.2s; }
  html:not([dark]) body { background: #ffffff; }
  #toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  #toolbar button { padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #secondary { width: 402px; }
  #transport { display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
            font: 12px Roboto, Arial, sans-serif; color: #aaa; }
  #transport input[type=range] { width: 320px; }
  html:not([dark]) #transport { color: #606060; }
  #fake-player { display: none; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="t-dark">Dark</button>
  <button id="t-light">Light</button>
  <button id="t-classic">Classic</button>
  <button id="t-quiet">Quiet</button>
  <button id="t-reset">Reset panel</button>
</div>
<div id="transport">
  <button id="p-toggle">Play</button>
  <input id="p-scrub" type="range" min="0" max="4362" step="1" value="0">
  <span id="p-clock">0:00 / 1:12:42</span>
  <span>25&times;</span>
</div>
<video id="fake-player" muted></video>
<div id="secondary"></div>

<script>
  // --- chrome.* stubs -------------------------------------------------------
  // The panel reads no settings of its own: it asks the background for the few
  // non-secret preferences it renders (GET_PANEL_PREFS), so the harness answers
  // that message instead of stubbing a storage area.
  window.__prefs = { skin: 'quiet', theme: 'system', summaryLength: 'standard',
    providerReady: true,
    // Set providerReady false to see the panel's "Add API key" state,
    // then press Reset panel.
  };

  const SAMPLE_SUMMARY = [
    // The overview line the validator emits above the sections (backlog #9).
    '>The speaker argues that defence manufacturing, not consumer technology, drives the next economic cycle, and that India\'s advantage will be cultural rather than industrial. Predictions are framed as readings, not forecasts, and the closing hour tests a long-horizon call.',
    '#Geopolitical Shifts and Global Conflicts',
    "[02:04] - China's Strategic Preparations: Intelligence sources indicate that China is actively preparing for a major conflict, though it remains unclear whether these preparations target India or the United States.",
    '[02:29] - India-US Relations: A direct war between the US and India is unlikely, but a persistent trade war is impacting India\'s economy as part of a broader cycle of global tension.',
    '[03:57] - The Weaponry Economy: Defense manufacturing is described as the engine of the next economic cycle, with several nations re-arming at a pace unseen since the Cold War.',
    "#India's Future and Leadership",
    '[06:28] - India as a Spiritual Capital: The speaker argues India\'s soft power will come from its spiritual traditions rather than manufacturing output.',
    '[07:47] - Rahu in the Tenth House: An astrological reading connects planetary positions to upcoming political transitions.',
    '[1:03:34] - Long-Horizon Forecast: A closing hour-mark segment stress-tests the h:mm:ss timestamp path with a long-form prediction about the coming decade.'
  ].join('\n');

  window.chrome = {
    runtime: {
      lastError: null,
      onMessage: { addListener() {} },
      sendMessage: (msg, cb) => {
        if (msg && msg.action === 'GET_PANEL_PREFS') {
          setTimeout(() => cb && cb({ ...window.__prefs }), 0);
        } else if (msg && msg.action === 'SET_PANEL_PREF') {
          window.__prefs[msg.name] = msg.value;
          if (cb) cb();
        } else if (msg && msg.action === 'START_ANALYSIS') {
          // Echo the request binding the way the background does, so the
          // panel's own stale-message checks are exercised here too.
          const meta = {
            videoId: msg.videoId, requestId: msg.requestId,
            provider: 'demo', modelId: 'demo-model-1', length: msg.length, points: 8,
            // The briefing rail reads the video's length and the summary's age.
            durationMinutes: 72.7, generatedAt: Date.now()
          };
          window.__lastRequest = meta;
          setTimeout(() => updateGenerateButton('calling_api'), 600);
          setTimeout(() => renderTimestampsUI(SAMPLE_SUMMARY, meta), 2200);
          setTimeout(() => cb && cb({ success: true }), 2300);
        } else if (cb) {
          if (msg && msg.action === 'CANCEL_ANALYSIS') window.__lastCancel = msg;
          cb({ success: true });
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="../styles/content.css">
<link rel="stylesheet" href="../styles/skin-quiet.css">
<script src="../scripts/ui-builder.js"></script>
<script>
  // Boot: apply the stubbed skin pref, then inject like content-main would.
  setPanelSkinPref(window.__prefs.skin);
  injectSidebar(document.getElementById('secondary'));

  document.getElementById('t-dark').onclick = () => {
    document.documentElement.setAttribute('dark', '');
    setPanelThemePref('dark');
  };
  document.getElementById('t-light').onclick = () => {
    document.documentElement.removeAttribute('dark');
    setPanelThemePref('light');
  };
  document.getElementById('t-classic').onclick = () => {
    window.__prefs.skin = 'classic';
    setPanelSkinPref('classic');
  };
  document.getElementById('t-quiet').onclick = () => {
    window.__prefs.skin = 'quiet';
    setPanelSkinPref('quiet');
  };
  // --- stub player ----------------------------------------------------------
  // The panel follows the playhead (backlog #16), so the harness needs a <video>
  // to follow. A media-less element keeps whatever currentTime is written to it
  // (the spec's "default playback start position"), which is all the tracker
  // reads; `timeupdate` is dispatched here at the ~4Hz a real player uses, and
  // `duration` is defined so the last point's progress hairline has a bound.
  const fake = document.getElementById('fake-player');
  const DEMO_DURATION = 4362;
  Object.defineProperty(fake, 'duration', { get: () => DEMO_DURATION });

  const scrub = document.getElementById('p-scrub');
  const clock = document.getElementById('p-clock');
  const toggle = document.getElementById('p-toggle');
  let timer = null;

  const hms = (t) => {
    t = Math.max(0, Math.floor(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const mm = h ? String(m).padStart(2, '0') : m;
    return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
  };

  const emit = () => {
    scrub.value = String(Math.round(fake.currentTime));
    clock.textContent = hms(fake.currentTime) + ' / ' + hms(DEMO_DURATION);
    fake.dispatchEvent(new Event('timeupdate'));
  };

  scrub.addEventListener('input', () => { fake.currentTime = +scrub.value; emit(); });

  toggle.onclick = () => {
    if (timer) {
      clearInterval(timer);
      timer = null;
      toggle.textContent = 'Play';
      return;
    }
    // 25x, so a 72-minute video crosses its points while you watch.
    timer = setInterval(() => {
      fake.currentTime = (fake.currentTime + 6.25) % DEMO_DURATION;
      emit();
    }, 250);
    toggle.textContent = 'Pause';
  };

  fake.currentTime = 0;
  emit();

  document.getElementById('t-reset').onclick = () => {
    clearSummaryCache(getCurrentVideoId());
    const c = document.querySelector('.yt-timestamps-container');
    if (c) renderEmptyState(c);
  };
</script>
</body>
</html>
