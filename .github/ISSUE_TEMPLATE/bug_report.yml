name: Bug report
description: Something in the extension behaved incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Please do not paste API keys.** The panel's *Copy details* button
        already strips keys, signed URLs and query strings — use it rather than
        pasting raw request logs, and check the text before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a video
        2. Click Generate summary
        3. ...
    validations:
      required: true

  - type: dropdown
    id: video-type
    attributes:
      label: Video type
      description: Caption availability is the most common cause of extraction failures.
      options:
        - Public video with a transcript panel
        - Public video, auto-generated captions only
        - Members-only video
        - Live stream
        - Not sure
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: Which provider ran, and the model name. Auto mode counts — say so.
      placeholder: Gemini, gemini-flash-lite-latest
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Extension and Chrome version
      placeholder: Extension 1.2, Chrome 140
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Output of the panel's *Copy details* button, if there was an error.
      render: text
